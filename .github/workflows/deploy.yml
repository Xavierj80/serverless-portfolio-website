name: Deploy Portfolio Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Never run two deploys at once (they'd fight over the Terraform state).
concurrency:
  group: portfolio-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Actions are pinned to exact commit SHAs: a moved or hijacked tag
      # can't swap in different code. The version is in the comment.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::897279496475:role/xavieraws-portfolio-ci
          role-session-name: portfolio-deploy-${{ github.run_id }}
          aws-region: us-east-1
          allowed-account-ids: "897279496475"

      # Must match the Terraform version used locally.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init -input=false

      # Save the plan, then apply EXACTLY that plan.
      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan -input=false -out=tfplan

      # State locking stays ON so a local apply and this job can't collide.
      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -input=false tfplan

      - name: Get outputs
        working-directory: ./terraform
        id: tf-outputs
        run: |
          echo "bucket=$(terraform output -raw s3_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"

      # --delete keeps the bucket identical to the website/ folder in the repo.
      - name: Sync website files to S3
        run: |
          aws s3 sync ./website "s3://${{ steps.tf-outputs.outputs.bucket }}" --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.tf-outputs.outputs.distribution }}" \
            --paths "/*"
